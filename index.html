<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geo Láda Kereső</title>
  <!-- Tailwind CSS és Leaflet CSS/JS betöltése -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    #map { width: 100%; height: 100%; z-index: 1; }
    /* Vak térkép stílus: elrejti a háttértérkép csempéit */
    .blind-map .leaflet-tile-pane { display: none !important; }
    .control-panel { z-index: 1000; }
  </style>
</head>
<body class="bg-gray-100 flex flex-col font-sans">

<!-- Felső Vezérlőpanel -->
<div class="control-panel absolute top-2 left-2 right-2 bg-white/95 backdrop-blur-md p-3 rounded-xl shadow-lg border border-gray-200 flex flex-col gap-2">
  <div class="flex gap-2">
    <input type="text" id="cityInput" placeholder="Írj be egy települést (pl. Salgótarján)..." class="flex-1 px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
    <button onclick="searchCity()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Keresés</button>
  </div>

  <div class="flex items-center justify-between pt-1 border-t border-gray-200 gap-2 flex-wrap">
    <!-- Térkép láthatósági kapcsoló -->
    <label class="flex items-center cursor-pointer text-sm font-medium text-gray-700">
      <input type="checkbox" id="toggleMapCheckbox" onchange="toggleMapTileVisibility()" class="sr-only peer">
      <div class="w-9 h-5 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
      <span class="ml-2 text-xs">Térkép</span>
    </label>

    <!-- KÜLÖNÁLLÓ GPS KI/BE KAPCSOLÓ GOMB -->
    <button id="gpsToggleBtn" onclick="toggleGPS()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1">
      <span>📍 GPS Bekapcsolása</span>
    </button>

    <!-- Játék és Törlés gombok -->
    <div class="flex gap-2">
      <button id="startBtn" onclick="toggleGame()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow transition">Start</button>
      <button onclick="clearGeocaches()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">Törlés</button>
    </div>
  </div>
</div>

<!-- Alsó Státusz- és Eredményjelző Panel -->
<div class="control-panel absolute bottom-4 left-2 right-2 bg-white/95 backdrop-blur-md p-3 rounded-xl shadow-lg border border-gray-200 text-xs flex flex-col gap-1 max-h-48 overflow-y-auto">
  <div id="statusText" class="font-bold text-gray-800">Állapot: Kattints a térképre ládák lehelyezéséhez!</div>
  <div id="gpsStatusText" class="text-blue-600 font-semibold">GPS állapot: Kikapcsolva</div>
  <div id="timerText" class="text-gray-600 font-mono">Eltelt idő: 00:00</div>
  <div class="font-semibold text-gray-700 mt-1">Megtalált geoládák:</div>
  <ul id="foundList" class="list-disc pl-4 text-green-700 space-y-0.5"></ul>
  <div class="mt-2 pt-1 border-t border-gray-200 text-center text-[10px] text-gray-500 font-medium">
    A programot készítette: Várkonyi-Török Zoltán & Gemini
  </div>
</div>

<!-- Térkép konténer (alapértelmezetten vak térkép) -->
<div id="map" class="blind-map"></div>

<script>
  let map;
  let userLocationMarker = null;
  let pathPolyline = null;
  let pathCoordinates = [];
  let geocaches = [];
  let watchPositionId = null;
  let isGpsActive = false;
  let isGameRunning = false;
  let startTime = null;
  let timerInterval = null;
  let foundGeocaches = [];

  window.onload = function() {
    initMap();
    loadStateFromStorage();
  };

  function initMap() {
    map = L.map('map').setView([47.4979, 19.0402], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    map.on('click', function(e) {
      addGeocache(e.latlng.lat, e.latlng.lng);
      saveStateToStorage();
    });

    pathPolyline = L.polyline([], { color: 'blue', weight: 4, opacity: 0.8 }).addTo(map);
  }

  function searchCity() {
    const city = document.getElementById('cityInput').value;
    if (!city) return;

    fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`)
      .then(response => response.json())
      .then(data => {
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          map.setView([lat, lon], 14);
          setTimeout(() => map.invalidateSize(), 200);
        } else {
          alert('Nem található a megadott település!');
        }
      })
      .catch(err => console.error('Keresési hiba:', err));
  }

  function toggleMapTileVisibility() {
    const checkbox = document.getElementById('toggleMapCheckbox');
    const mapElement = document.getElementById('map');
    if (checkbox.checked) {
      mapElement.classList.remove('blind-map');
    } else {
      mapElement.classList.add('blind-map');
    }
    map.invalidateSize();
  }

  // KÜLÖNÁLLÓ GPS KI/BE KAPCSOLÓ FÜGGVÉNY
  function toggleGPS() {
    if (!isGpsActive) {
      startGPS();
    } else {
      stopGPS();
    }
    saveStateToStorage();
  }

  function startGPS() {
    if ('geolocation' in navigator) {
      watchPositionId = navigator.geolocation.watchPosition(
        positionUpdate,
        positionError,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
      );
      isGpsActive = true;
      const btn = document.getElementById('gpsToggleBtn');
      btn.innerHTML = '<span>📍 GPS Kikapcsolása</span>';
      btn.className = 'bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1';
      document.getElementById('gpsStatusText').innerText = 'GPS állapot: Aktív (Vevő bekapcsolva)';
      document.getElementById('gpsStatusText').className = 'text-green-600 font-semibold';
    } else {
      alert('A készülék nem támogatja a helymeghatározást!');
    }
  }

  function stopGPS() {
    if (watchPositionId !== null) {
      navigator.geolocation.clearWatch(watchPositionId);
      watchPositionId = null;
    }
    isGpsActive = false;
    const btn = document.getElementById('gpsToggleBtn');
    btn.innerHTML = '<span>📍 GPS Bekapcsolása</span>';
    btn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1';
    document.getElementById('gpsStatusText').innerText = 'GPS állapot: Kikapcsolva';
    document.getElementById('gpsStatusText').className = 'text-blue-600 font-semibold';
  }

  function positionUpdate(position) {
    const lat = position.coords.latitude;
    const lng = position.coords.longitude;
    const userLatLng = [lat, lng];

    if (!userLocationMarker) {
      userLocationMarker = L.circleMarker(userLatLng, { radius: 8, fillColor: '#2563eb', color: 'white', weight: 2, fillOpacity: 1 }).addTo(map);
    } else {
      userLocationMarker.setLatLng(userLatLng);
    }

    if (isGameRunning) {
      pathCoordinates.push(userLatLng);
      pathPolyline.setLatLngs(pathCoordinates);
      checkGeocacheProximity(lat, lng);
    }

    saveStateToStorage();
  }

  function positionError(err) {
    console.warn('GPS hiba:', err.message);
    document.getElementById('gpsStatusText').innerText = 'GPS állapot: Jelfogási hiba (' + err.message + ')';
    document.getElementById('gpsStatusText').className = 'text-red-600 font-semibold';
  }

  function addGeocache(lat, lng, isFound = false) {
    const id = geocaches.length + 1;

    const circle = L.circle([lat, lng], {
      radius: 50,
      color: isFound ? 'green' : 'gold',
      fillColor: isFound ? '#22c55e' : '#eab308',
      fillOpacity: 0.3,
      weight: 2
    }).addTo(map);

    const marker = L.marker([lat, lng]).addTo(map);
    marker.bindPopup(`Geo láda #${id} (50m célzóna)`);

    geocaches.push({
      id: id,
      lat: lat,
      lng: lng,
      marker: marker,
      circle: circle,
      found: isFound
    });
  }

  function saveStateToStorage() {
    const cacheData = geocaches.map(c => ({ id: c.id, lat: c.lat, lng: c.lng, found: c.found }));
    const state = {
      geocaches: cacheData,
      pathCoordinates: pathCoordinates,
      isGameRunning: isGameRunning,
      isGpsActive: isGpsActive,
      startTime: startTime,
      foundGeocaches: foundGeocaches
    };
    localStorage.setItem('geoGameSaveState', JSON.stringify(state));
  }

  function loadStateFromStorage() {
    const saved = localStorage.getItem('geoGameSaveState');
    if (!saved) return;

    try {
      const state = JSON.parse(saved);

      if (state.geocaches) {
        state.geocaches.forEach(c => addGeocache(c.lat, c.lng, c.found));
      }

      if (state.pathCoordinates) {
        pathCoordinates = state.pathCoordinates;
        pathPolyline.setLatLngs(pathCoordinates);
      }

      if (state.foundGeocaches) {
        foundGeocaches = state.foundGeocaches;
        foundGeocaches.forEach(f => {
          const li = document.createElement('li');
          li.innerText = `Láda #${f.id} - Megtalálva: ${f.time}`;
          document.getElementById('foundList').appendChild(li);
        });
      }

      if (state.isGpsActive) {
        startGPS();
      }

      if (state.isGameRunning) {
        startTime = state.startTime || Date.now();
        resumeGame();
      }
    } catch (e) {
      console.error('Hiba a mentés betöltésekor:', e);
    }
  }

  function clearGeocaches() {
    if (isGameRunning) stopGame('Játék törölve.');
    geocaches.forEach(c => {
      map.removeLayer(c.marker);
      map.removeLayer(c.circle);
    });
    geocaches = [];
    pathCoordinates = [];
    foundGeocaches = [];
    pathPolyline.setLatLngs([]);
    localStorage.removeItem('geoGameSaveState');
    document.getElementById('foundList').innerHTML = '';
    document.getElementById('statusText').innerText = 'Állapot: Törölve. Kattints a térképre új ládákért!';
    document.getElementById('timerText').innerText = 'Eltelt idő: 00:00';
  }

  function toggleGame() {
    if (!isGameRunning) {
      if (geocaches.length === 0) {
        alert('Helyezz el legalább egy ládát a térképen az indítás előtt!');
        return;
      }
      if (!isGpsActive) {
        startGPS(); // Automatikus GPS indítás Start megnyomásakor, ha még nem futott
      }
      startTime = Date.now();
      resumeGame();
    } else {
      stopGame('Játék szüneteltetve.');
    }
  }

  function resumeGame() {
    isGameRunning = true;
    const startBtn = document.getElementById('startBtn');
    startBtn.innerText = 'Stop';
    startBtn.className = 'bg-red-600 hover:bg-red-700 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow transition';
    document.getElementById('statusText').innerText = 'Állapot: Játék folyamatban! Keresd a ládákat...';

    startTimer();
    saveStateToStorage();
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const elapsedMs = Date.now() - startTime;
      const totalSeconds = Math.floor(elapsedMs / 1000);
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      document.getElementById('timerText').innerText = `Eltelt idő: ${minutes}:${seconds}`;
    }, 1000);
  }

  function checkGeocacheProximity(userLat, userLng) {
    geocaches.forEach(cache => {
      if (!cache.found) {
        const distance = getDistanceInMeters(userLat, userLng, cache.lat, cache.lng);
        if (distance <= 50) {
          cache.found = true;
          cache.circle.setStyle({ color: 'green', fillColor: '#22c55e' });

          const timeFound = document.getElementById('timerText').innerText.replace('Eltelt idő: ', '');
          foundGeocaches.push({ id: cache.id, time: timeFound });

          cache.marker.bindPopup(`Geo láda #${cache.id} - MEGTALÁLVA! (${timeFound})`).openPopup();

          const li = document.createElement('li');
          li.innerText = `Láda #${cache.id} - Megtalálva: ${timeFound}`;
          document.getElementById('foundList').appendChild(li);

          if (foundGeocaches.length === geocaches.length) {
            stopGame('Gratulálunk! Az összes geoládát megtaláltad!');
          }
        }
      }
    });
  }

  function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;
    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;

    const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
      Math.cos(φ1) * Math.cos(φ2) *
      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
  }

  function stopGame(message) {
    isGameRunning = false;
    clearInterval(timerInterval);

    const startBtn = document.getElementById('startBtn');
    startBtn.innerText = 'Start';
    startBtn.className = 'bg-green-600 hover:bg-green-700 text-white px-4 py-1.5 rounded-lg text-xs font-semibold shadow transition';
    document.getElementById('statusText').innerText = `Állapot: ${message}`;
    saveStateToStorage();
  }
</script>
</body>
</html>
